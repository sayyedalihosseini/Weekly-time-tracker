<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a1229" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Time Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark light;--bg:#0a1229;--sf:#12244f;--sf2:#1a2f60;--tx:#fff;--mu:#9fb3d9;--ac:#2383e2;--acd:#155aa6;--on:#fff;--bd:#223a72}
@media (prefers-color-scheme:light){:root{--bg:#fbf6ef;--sf:#fff;--sf2:#f1e7da;--tx:#2a1a10;--mu:#8a6f5a;--ac:#d9731f;--acd:#a4530f;--bd:#ecdcc8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 Lexend,system-ui,-apple-system,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 18px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:6px 0 2px;font-weight:700}
.mut{color:var(--mu);font-size:14px;margin:4px 0 12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.rb{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);font:700 20px Lexend;cursor:pointer}
.nav{display:flex;gap:8px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.chip{position:relative;background:var(--sf);border-radius:24px;padding:14px 18px;min-height:84px}
.chip small{display:block;color:var(--mu);font-size:13px}
.chip b{font-size:26px;font-weight:700}
.chip i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-size:30px}
.card{background:var(--sf);border-radius:24px;padding:16px 18px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:19px}
summary{font-weight:700;font-size:18px;cursor:pointer}
textarea,input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:16px;padding:12px 14px;font:inherit;margin-top:8px}
textarea{min-height:110px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--ac);color:var(--on);font:700 17px Lexend;padding:16px;box-shadow:0 5px 0 var(--acd);cursor:pointer;margin:12px 0 8px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acd)}
.btn.g{background:var(--sf2);color:var(--tx);box-shadow:0 5px 0 var(--bd)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.days button{flex:1;border:0;border-radius:999px;padding:10px 0;background:var(--sf);color:var(--mu);font:500 14px Lexend;cursor:pointer}
.days .on{background:var(--ac);color:var(--on);box-shadow:0 3px 0 var(--acd)}
.bar{height:10px;border-radius:9px;background:var(--sf2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ac);border-radius:9px}
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid transparent;border-radius:18px;margin:6px 0;padding:11px 14px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.slot.has{background:color-mix(in srgb,var(--c) 20%,var(--sf));border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.slot.hr .t{font-weight:700}
.slot .t{width:46px;color:var(--mu);font-size:14px;flex:none}
.slot .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.slot .n em{display:block;font-style:normal;color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.slot.cur{border-color:var(--ac);border-bottom-width:5px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.map{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.map u{height:5px;border-radius:2px;background:var(--sf2)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs button{flex:1;max-width:180px;border:0;border-radius:20px;padding:9px 0 7px;background:transparent;color:var(--mu);font:500 12px Lexend;cursor:pointer}
.tabs button svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .on{background:var(--sf);color:var(--ac)}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.open{display:flex}
#sheet>div{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--sf);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.cg button{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);padding:10px 12px;font:500 14px Lexend;cursor:pointer}
.cg .on{border-color:var(--ac);border-bottom-width:5px}
.set{display:grid;grid-template-columns:14px 1fr 64px 44px;gap:8px;align-items:center;margin:6px 0}
.set input{margin:0;padding:9px 10px}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.err{color:#f0645a;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
// ====== SUPABASE CONFIG (leave empty = local-only mode) ======
const SB_URL='https://dphullvddbebbhlesfkl.supabase.co', SB_KEY='sb_publishable_K2c5MjsDjCYwSVldHu9VQw_BAFOvi9j';
// =============================================================
const sb=(SB_URL&&window.supabase)?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s);
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const COL=['#8b5cf6','#3b82f6','#06b6d4','#14b8a6','#94a3b8','#22c55e','#eab308','#f97316','#a78bfa','#ec4899','#64748b','#ef4444'];
const DEF=[['Deep Work',15,1],['Study',12,1],['Job Search',12,1],['Meetings/Class',8,1],['Admin',5,0],['Exercise',10,0],['Social',5,0],['Meals',3,0],['Rest',3,0],['Leisure',2,0],['Commute',1,0],['Wasted',-5,0]];
const ls=(k,v)=>v===undefined?(()=>{try{return JSON.parse(localStorage.getItem('wtt:'+k))}catch(e){return null}})():localStorage.setItem('wtt:'+k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monday=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const tm=i=>{const m=495+15*i;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const todayIdx=()=>(new Date().getDay()+6)%7;
const curSlot=()=>{const n=new Date(),m=n.getHours()*60+n.getMinutes();return Math.min(63,Math.max(0,Math.ceil((m-495)/15)))};

let cats=ls('cats')||DEF.map(([n,xp,f])=>({n,xp,f})), week=monday(), day=todayIdx(), tab='today';
let data={s:{},p:{}}, user=null, offline=!!ls('offline'), sel=null, selCat=null, timer;

// ---- stats ----
function dayStats(d){let n=0,xp=0,foc=0,waste=0,h=cats.map(()=>0);
 for(let i=0;i<64;i++){const s=data.s[d+'-'+i];if(!s||!cats[s[0]])continue;const c=cats[s[0]];n++;xp+=c.xp;h[s[0]]+=.25;if(c.f)foc+=.25;if(s[0]==cats.length-1)waste+=.25}
 return{n,xp,foc,waste,h}}
const verdict=x=>x>=450?'BEAST MODE':x>=300?'Strong day':x>=150?'Building momentum':'Getting started';
function weekStats(){const days=[0,1,2,3,4,5,6].map(dayStats);
 const t={xp:0,foc:0,waste:0,n:0,h:cats.map(()=>0)};
 days.forEach(s=>{t.xp+=s.xp;t.foc+=s.foc;t.waste+=s.waste;t.n+=s.n;s.h.forEach((v,i)=>t.h[i]+=v)});
 let run=0,best=0;days.forEach(s=>{run=s.n>=48?run+1:0;best=Math.max(best,run)});
 return{days,t,streak:best,pct:Math.round(t.n/448*100)}}

// ---- storage / sync ----
function save(){ls('w:'+week,data);ls('dirty:'+week,1);clearTimeout(timer);const w=week,d=data;timer=setTimeout(()=>push(w,d),800)}
async function push(w,d){if(!sb||!user)return;const{error}=await sb.from('weeks').upsert({user_id:user.id,week_start:w,data:d,updated_at:new Date().toISOString()});if(!error)localStorage.removeItem('wtt:dirty:'+w)}
async function saveCats(){ls('cats',cats);if(sb&&user)await sb.from('settings').upsert({user_id:user.id,cats,updated_at:new Date().toISOString()})}
async function loadWeek(){data=ls('w:'+week)||{s:{},p:{}};render();
 if(!sb||!user)return;
 if(ls('dirty:'+week)){push(week,data);return}
 const{data:r}=await sb.from('weeks').select('data').eq('week_start',week).maybeSingle();
 if(r){data=r.data;ls('w:'+week,data);render()}}
async function boot(){
 if(sb&&user){const{data:r}=await sb.from('settings').select('cats').maybeSingle();if(r){cats=r.cats;ls('cats',cats)}else saveCats()}
 loadWeek()}
function go(n){week=addDays(week,7*n);day=week==monday()?todayIdx():0;loadWeek()}

// ---- views ----
const ICON={today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',week:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',setup:'<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>'};
const head=(t,sub,nav)=>`<header><div><h1>${t}</h1><div class="mut" style="margin:0">${sub}</div></div>${nav?`<div class="nav"><button class="rb" data-act="prev" aria-label="Previous week">‹</button><button class="rb" data-act="next" aria-label="Next week">›</button></div>`:''}</header>`;
const chip=(l,v,i)=>`<div class="chip"><small>${l}</small><b>${v}</b><i>${i}</i></div>`;
const range=()=>fmt(week)+' – '+fmt(addDays(week,6));

function vToday(){const s=dayStats(day),pct=Math.round(s.n/64*100),cur=week==monday()&&day==todayIdx()?curSlot():-1;
 let h=head('Today',DN[day]+' '+fmt(addDays(week,day))+' · week of '+fmt(week),1);
 h+=`<div class="chips">${chip('XP today',s.xp,'⚡')}${chip('Focus',s.foc.toFixed(1)+' h','🎯')}</div>`;
 h+=`<div class="days">${DN.map((n,i)=>`<button class="${i==day?'on':''}" data-act="day" data-i="${i}">${n}</button>`).join('')}</div>`;
 h+=`<div class="bar"><span style="width:${pct}%"></span></div><p class="mut">${s.n}/64 slots logged, ${pct}%. ${verdict(s.xp)}</p>`;
 h+=`<details class="card"><summary>Daily plan</summary><textarea data-plan placeholder="What is the plan for ${DN[day]}?">${esc(data.p[day]||'')}</textarea></details>`;
 for(let i=0;i<64;i++){const v=data.s[day+'-'+i],c=v&&cats[v[0]];
  h+=`<button class="slot ${c?'has':''} ${i%4==3?'hr':''} ${i==cur?'cur':''}" data-act="slot" data-i="${i}" ${c?`style="--c:${COL[v[0]]}"`:''}><span class="t">${tm(i)}</span><span class="n">${c?esc(c.n)+(v[1]?`<em>${esc(v[1])}</em>`:''):'<span style="color:var(--mu)">Tap to log</span>'}</span></button>`}
 return h}

function vWeek(){const W=weekStats(),lvl=Math.floor(W.t.xp/500)+1,into=((W.t.xp%500)+500)%500;
 let bd=0;W.days.forEach((s,i)=>{if(s.xp>W.days[bd].xp)bd=i});
 const st=W.pct>=85?'Excellent tracking week':W.pct>=60?'Good, keep the chain going':W.pct>=30?'Warming up':'Getting started';
 const lt=W.t.n?Math.round(W.t.waste*4/W.t.n*100):0;
 let h=head('Week',range(),1);
 h+=`<div class="chips">${chip('Total XP',W.t.xp,'⚡')}${chip('Level','LV '+lvl,'🏆')}${chip('Focus',W.t.foc.toFixed(1)+' h','🎯')}${chip('Best streak',W.streak+' d','🔥')}</div>`;
 h+=`<div class="card"><div class="bar"><span style="width:${into/5}%"></span></div><p class="mut" style="margin-bottom:0">${500-into} XP to level ${lvl+1}</p></div>`;
 h+=`<div class="card"><div class="row"><span class="grow">Week logged</span><b>${W.pct}%</b></div><div class="bar"><span style="width:${W.pct}%"></span></div><p class="mut" style="margin-bottom:0">${st}. Best day: ${W.t.xp?DN[bd]+' ('+W.days[bd].xp+' XP)':'none yet'}. Time leak: ${W.t.waste.toFixed(1)} h (${lt}%).</p></div>`;
 h+=`<div class="card"><h3>Day by day</h3>${W.days.map((s,i)=>`<div class="row"><span style="width:36px">${DN[i]}</span><div class="grow bar"><span style="width:${Math.round(s.n/64*100)}%"></span></div><span style="width:70px;text-align:right;font-size:14px">${s.xp} XP ${s.n>=48?'✓':''}</span></div>`).join('')}</div>`;
 const mx=Math.max(.25,...W.t.h);
 h+=`<div class="card"><h3>Hours by category</h3>${cats.map((c,i)=>W.t.h[i]?`<div class="row"><span class="dot" style="background:${COL[i]}"></span><span style="width:112px;font-size:14px">${esc(c.n)}</span><div class="grow bar"><span style="width:${W.t.h[i]/mx*100}%;background:${COL[i]}"></span></div><span style="width:44px;text-align:right;font-size:14px">${W.t.h[i].toFixed(1)}</span></div>`:'').join('')||'<p class="mut">Nothing logged yet.</p>'}</div>`;
 let m='';for(let i=0;i<64;i++)for(let d=0;d<7;d++){const v=data.s[d+'-'+i];m+=v&&cats[v[0]]?`<u style="background:${COL[v[0]]}"></u>`:'<u></u>'}
 h+=`<div class="card"><h3>Week map</h3><div class="map">${m}</div></div>`;
 return h}

function vSetup(){let h=head('Setup','Categories, XP and focus');
 h+=`<div class="card"><div class="set mut" style="margin:0"><span></span><span>Name</span><span>XP</span><span>Focus</span></div>${cats.map((c,i)=>`<div class="set"><span class="dot" style="background:${COL[i]}"></span><input type="text" value="${esc(c.n)}" data-ci="${i}" data-f="n"><input type="number" value="${c.xp}" data-ci="${i}" data-f="xp"><input type="checkbox" ${c.f?'checked':''} data-ci="${i}" data-f="f"></div>`).join('')}<p class="mut" style="margin-bottom:0">The last row is your time leak category.</p></div>`;
 h+=`<div class="card"><h3>Account</h3>`+(sb?(user?`<p class="mut">Signed in as ${esc(user.email)}. Data syncs across your devices.</p><button class="btn g" data-act="out">Sign out</button>`:`<p class="mut">Local mode. Sign in to sync.</p><button class="btn" data-act="signin">Sign in</button>`):`<p class="mut">Local mode. Add your Supabase keys in index.html to sync devices.</p>`)+`</div>`;
 return h}

function vAuth(){return `<h1 style="margin-top:40px">Time Log</h1><p class="mut">Sign in to sync your weeks across devices.</p><div class="card"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="err" id="msg"></div><button class="btn" data-act="in">Sign in</button><button class="btn g" data-act="up">Create account</button></div><button class="btn g" data-act="off">Use without account</button>`}

function render(){
 if(sb&&!user&&!offline){$('#app').innerHTML=vAuth();return}
 const y=scrollY;
 $('#app').innerHTML=({today:vToday,week:vWeek,setup:vSetup})[tab]()+`<nav class="tabs">${['today','week','setup'].map(t=>`<button class="${t==tab?'on':''}" data-act="tab" data-t="${t}">${ICON[t]}${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</nav>`;
 scrollTo(0,y)}

function openSheet(i){sel=i;const v=data.s[day+'-'+i];selCat=v?v[0]:null;
 $('#sheet').innerHTML=`<div><h3 style="margin:0">${DN[day]}, ${tm(i)}</h3><p class="mut" style="margin:2px 0">What did you do in the 15 minutes before?</p><div class="cg">${cats.map((c,k)=>`<button data-act="cat" data-i="${k}" class="${k===selCat?'on':''}"><span class="dot" style="background:${COL[k]}"></span>${esc(c.n)}</button>`).join('')}</div><input id="act" type="text" placeholder="Activity (optional)" value="${esc(v?v[1]:'')}"><select id="fill">${[0,1,2,3,4,5,6,7].map(n=>`<option value="${n}">${n?'Also fill the next '+n+' slot'+(n>1?'s':''):'This slot only'}</option>`).join('')}</select><button class="btn" data-act="ok">Save</button><button class="btn g" data-act="clr">Clear</button></div>`;
 $('#sheet').classList.add('open')}
const closeSheet=()=>$('#sheet').classList.remove('open');

async function auth(k){const email=$('#em').value.trim(),password=$('#pw').value;
 const r=k=='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 $('#msg').textContent=r.error?r.error.message:(k=='up'&&!r.data.session?'Check your email to confirm, then sign in.':'')}

document.addEventListener('click',async e=>{
 if(e.target.id=='sheet')return closeSheet();
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 if(a=='tab'){tab=b.dataset.t;render();scrollTo(0,0)}
 else if(a=='prev')go(-1);else if(a=='next')go(1);
 else if(a=='day'){day=i;render()}
 else if(a=='slot')openSheet(i);
 else if(a=='cat'){selCat=i;document.querySelectorAll('.cg button').forEach((x,k)=>x.classList.toggle('on',k==i))}
 else if(a=='ok'){if(selCat===null)return;const t=$('#act').value.trim(),n=+$('#fill').value;
  for(let k=0;k<=n&&sel+k<64;k++)data.s[day+'-'+(sel+k)]=[selCat,t];save();closeSheet();render()}
 else if(a=='clr'){const n=+$('#fill').value;for(let k=0;k<=n&&sel+k<64;k++)delete data.s[day+'-'+(sel+k)];save();closeSheet();render()}
 else if(a=='in'||a=='up')auth(a);
 else if(a=='off'){offline=true;ls('offline',1);boot()}
 else if(a=='signin'){offline=false;localStorage.removeItem('wtt:offline');render()}
 else if(a=='out'){await sb.auth.signOut()}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.plan!==undefined){data.p[day]=t.value;save()}
 else if(t.dataset.ci!==undefined){const c=cats[+t.dataset.ci],f=t.dataset.f;c[f]=f=='n'?t.value:f=='xp'?+t.value||0:t.checked?1:0;saveCats()}});

(async()=>{
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
 if(sb){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;
  sb.auth.onAuthStateChange((ev,s)=>{const id=s?.user?.id;if(id!==user?.id){user=s?.user||null;user?boot():render()}})}
 // new Monday: week is recomputed at every launch
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab!='setup'&&monday()!=week&&week==ls('last')){week=monday();day=todayIdx();loadWeek()}});
 ls('last',week);
 if(sb&&!user&&!offline)render();else boot();
})();
</script>
</body>
</html>
