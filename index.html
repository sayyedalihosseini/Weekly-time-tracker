<style>
:root{--bg:#0a1229;--sf:#12244f;--sf2:#1a2f60;--tx:#fff;--mu:#9fb3d9;--ac:#2383e2;--acd:color-mix(in srgb,var(--ac) 62%,#000);--on:#fff;--bd:#223a72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 Lexend,system-ui,-apple-system,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 18px calc(112px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:6px 0 2px;font-weight:700}
.mut{color:var(--mu);font-size:14px;margin:4px 0 12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.rb{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);font:700 20px Lexend;cursor:pointer}
.nav{display:flex;gap:8px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.chip{position:relative;background:var(--sf);border-radius:24px;padding:14px 18px;min-height:84px}
.chip small{display:block;color:var(--mu);font-size:13px}
.chip b{font-size:26px;font-weight:700}
.chip i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-size:30px}
.card{background:var(--sf);border-radius:24px;padding:16px 18px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:19px}
summary{font-weight:700;font-size:18px;cursor:pointer}
textarea,input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:16px;padding:12px 14px;font:inherit;margin-top:8px}
textarea{min-height:110px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--ac);color:var(--on);font:700 17px Lexend;padding:16px;box-shadow:0 5px 0 var(--acd);cursor:pointer;margin:12px 0 8px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acd)}
.btn.g{background:var(--sf2);color:var(--tx);box-shadow:0 5px 0 var(--bd)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.days button{flex:1;border:0;border-radius:999px;padding:10px 0;background:var(--sf);color:var(--mu);font:500 14px Lexend;cursor:pointer}
.days .on{background:var(--ac);color:var(--on);box-shadow:0 3px 0 var(--acd)}
.bar{height:10px;border-radius:9px;background:var(--sf2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ac);border-radius:9px}
.slot{display:grid;grid-template-columns:46px 120px minmax(0,1fr);align-items:center;gap:8px;border:2px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:16px;margin:3px 0;padding:6px 12px;background:var(--sf)}
.slot.has{background:color-mix(in srgb,var(--c) 20%,var(--sf));border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.slot.cur{border-color:var(--ac)}
.slot.cur.has{border-color:var(--c)}
.slot .t{color:var(--mu);font-size:13px}.slot .t.b{font-weight:700;color:var(--tx)}
.cb{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--tx);font:500 14px Lexend;text-align:left;padding:0;cursor:pointer;min-width:0}
.cb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,transparent);flex:none}
.cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ph{color:var(--mu)}
.slot .nt{width:100%;margin:0;padding:6px 10px;border:1.5px solid color-mix(in srgb,var(--tx) 12%,transparent);border-radius:12px;background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--tx);font:400 14px Lexend}
.slot .nt:focus{outline:0;border-color:var(--ac)}
.hour{margin:8px 0}
.narrow{max-width:560px;margin:0 auto}
.fab,.pt{display:none}
.fab{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:4;border:0;border-radius:999px;background:var(--ac);color:var(--on);font:700 14px Lexend;padding:13px 18px;box-shadow:0 4px 0 var(--acd),0 8px 20px #0005;cursor:pointer}
#sheet .card{background:var(--bg)}
.plan textarea{overflow:hidden;min-height:90px}
@media(min-width:760px){#app{max-width:1120px}.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}.dgrid main{grid-column:1;grid-row:1}.dgrid aside{grid-column:2;grid-row:1;position:sticky;top:12px;max-height:calc(100vh - 110px);overflow:auto}}
.hgcol{display:none}
@media(min-width:1180px){#app{max-width:1460px}.dgrid{grid-template-columns:minmax(0,1fr) 380px 240px}.dgrid aside.hgcol{display:block;grid-column:3;overflow:visible}.tabs .t-glass{display:none}}
@media(max-width:759px){.an{display:none}.pt{display:inline-block}.plan.shut .pb,.plan.shut .pp{display:none}.hour{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:6px 0}.slot{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:6px;margin:0;border-radius:12px}.slot .t{font-size:10px}.cb{font-size:11px;gap:4px}.slot{cursor:pointer}.slot .nt{font-size:11px;padding:4px 5px;border-radius:8px;pointer-events:none}.fab{display:block}}
.row{display:flex;align-items:center;gap:10px;padding:8px 0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.map{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.map u{height:5px;border-radius:2px;background:var(--sf2)}

#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.open{display:flex}
#sheet>div{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--sf);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.cg button{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);padding:10px 12px;font:500 14px Lexend;cursor:pointer}
.cg .on{border-color:var(--ac);border-bottom-width:5px}
.set{display:grid;grid-template-columns:30px 1fr 64px 44px;gap:8px;align-items:center;margin:6px 0}
.set input{margin:0;padding:9px 10px}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.err{color:#f0645a;font-size:14px;min-height:20px}
.pill{border:0;border-radius:999px;background:var(--sf2);color:var(--tx);font:500 14px Lexend;padding:8px 16px;cursor:pointer}
.seg{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:999px}
.seg button{flex:1;border:0;border-radius:999px;padding:10px 0;background:transparent;color:var(--mu);font:500 14px Lexend;cursor:pointer}
.seg .on{background:var(--ac);color:var(--on);box-shadow:0 3px 0 var(--acd)}
.sws{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin:16px 4px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline:0}
.sw.on{border-color:var(--tx)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:transparent;color:var(--tx);font:500 15px Lexend;padding:10px 0;text-align:left;cursor:pointer}
.tg small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.tg i{width:48px;height:28px;border-radius:99px;background:var(--sf2);position:relative;flex:none;transition:background .15s}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on i{background:var(--ac)}.tg.on i::after{transform:translateX(20px)}
.tg:disabled{opacity:.4;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sd{position:relative;cursor:pointer;display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:10px;background:#888;vertical-align:middle}.sd.ok{background:#22c55e}.sd.wait{background:#eab308}.sd.err{background:#ef4444}
.slot.fs{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 55%,transparent)}
.ta{margin:12px 0 0}.kb{font-size:12px;margin:6px 0 0}
.btn:disabled{opacity:.4;box-shadow:none;cursor:default}
@media(hover:none){.ta,.kb{display:none}}
.sd::before{content:"";position:absolute;inset:-14px}
#toast{max-width:90vw;text-align:center}
/* floating nav */
.tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;width:min(calc(100% - 28px),440px);display:grid;grid-template-columns:repeat(var(--n,4),1fr);padding:6px;border-radius:30px;background:color-mix(in srgb,var(--sf) 68%,transparent);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border:1px solid color-mix(in srgb,var(--tx) 12%,transparent);box-shadow:0 14px 34px #0004,inset 0 1px 0 color-mix(in srgb,var(--tx) 10%,transparent);transition:padding .35s,width .45s cubic-bezier(.3,1.3,.5,1)}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n,4));border-radius:24px;background:color-mix(in srgb,var(--ac) 20%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ac) 42%,transparent);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s cubic-bezier(.34,1.4,.5,1),top .35s,bottom .35s,left .35s,width .35s}
.tabs button{position:relative;z-index:1;border:0;background:none;color:var(--mu);font:500 11px Lexend;padding:8px 0 7px;border-radius:24px;cursor:pointer;transition:color .25s}
.tabs button svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.34,1.56,.64,1),margin .35s}
.tabs button span{display:block;max-height:16px;overflow:hidden;transition:max-height .3s,opacity .25s}
.tabs button.on{color:var(--ac)}
.tabs button.on svg{animation:tpop .55s cubic-bezier(.34,1.56,.64,1)}
.tabs button.on.t-glass svg{animation:tflip .7s cubic-bezier(.5,-.3,.3,1.3) forwards}
.tabs button:active svg{transform:scale(.82)}
@keyframes tpop{0%{transform:scale(.6) translateY(5px)}100%{transform:none}}
@keyframes tflip{0%{transform:rotate(0)}100%{transform:rotate(180deg)}}
.tabs.mini{padding:4px;width:min(calc(100% - 28px),340px)}
.tabs.mini .ind{top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,4))}
.tabs.mini button{padding:7px 0}.tabs.mini button span{max-height:0;opacity:0}.tabs.mini button svg{margin-bottom:0}
/* hourglass */
.hg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hgw{width:min(180px,50vw);aspect-ratio:2/3;transition:transform 1.6s cubic-bezier(.65,-.15,.25,1.2);will-change:transform}
.hgbig .hgw{width:min(250px,62vw)}
.hgw svg{display:block;width:100%;height:100%;overflow:visible}
.hgw .gf{fill:color-mix(in srgb,var(--tx) 7%,transparent)}
.hgw .go{fill:none;stroke:color-mix(in srgb,var(--tx) 40%,transparent);stroke-width:3;stroke-linejoin:round}
.hgw .pl{fill:var(--sf2);stroke:var(--bd);stroke-width:2}
.hgw .sa,.hgw .sb{fill:var(--ac)}
.hgw .hl{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:3;stroke-linecap:round}
.hgw .st0{stroke:var(--ac);stroke-width:2;opacity:.5;transition:opacity .3s}
.hgw .st1{stroke:var(--ac);stroke-width:2.6;stroke-dasharray:2 5;stroke-linecap:round;animation:hgf .45s linear infinite;transition:opacity .3s}
.hg.fl .st0,.hg.fl .st1{opacity:0}
@keyframes hgf{to{stroke-dashoffset:-7}}
.hgm{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.hgbig .hgm{font-size:44px}
.hgcard{text-align:center}.hgcard h3{text-align:left}
/* now / next trio (phones only) */
.tri{display:none}
.trow{display:grid;grid-template-columns:46px 44px minmax(0,1fr);align-items:center;gap:8px;text-align:left;width:100%;border:2px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:18px;background:var(--sf);color:var(--tx);font:inherit;padding:9px 12px;min-height:58px;cursor:pointer}
.trow.has{background:color-mix(in srgb,var(--c) 20%,var(--sf));border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.trow.now{border-color:var(--ac);border-bottom-width:5px}
.trow.now.has{border-color:var(--c)}
.trow.now.has .ttag{color:var(--tx)}
.trow.off{opacity:.45;cursor:default;border-color:transparent}
.ttag{font-size:11px;font-weight:700;color:var(--mu)}.trow.now .ttag{color:var(--ac)}
.ttm{font-size:13px;color:var(--mu)}
.tbd{min-width:0;display:flex;flex-direction:column}
.tbd b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbd b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.tbd b.ph{color:var(--mu)}.tbd b.ph::before{display:none}
.tbd em{font-style:normal;font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:759px){.tri{display:flex;flex-direction:column;gap:8px;margin-top:14px}.hgbig .hgw{width:min(160px,42vw)}.hgbig .hgm{font-size:38px}.hgnote{display:none}.hgcard.pg{padding:12px 18px}}
@media(prefers-reduced-motion:reduce){.hgw{transition-duration:.01s}.hgw .st1{animation:none}.tabs,.tabs *{transition-duration:.01s!important;animation:none!important}}
.set input.cp{width:28px;height:28px;padding:0;margin:0;border:0;border-radius:50%;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.cp::-webkit-color-swatch-wrapper{padding:0}
.cp::-webkit-color-swatch{border:2px solid color-mix(in srgb,var(--tx) 25%,transparent);border-radius:50%}
.cp::-moz-color-swatch{border:2px solid color-mix(in srgb,var(--tx) 25%,transparent);border-radius:50%}
</style>

<body>

<script>
// ====== SUPABASE CONFIG (leave empty = local-only mode) ======
const SB_URL='https://dphullvddbebbhlesfkl.supabase.co', SB_KEY='sb_publishable_K2c5MjsDjCYwSVldHu9VQw_BAFOvi9j';
// =============================================================
const sb=(SB_URL&&window.supabase)?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s);
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const COL=['#8b5cf6','#3b82f6','#06b6d4','#14b8a6','#94a3b8','#22c55e','#eab308','#f97316','#a78bfa','#ec4899','#64748b','#ef4444'];
const col=i=>(cats[i]&&cats[i].c)||COL[i]||'#888';
const DEF=[['Deep Work',15,1],['Study',12,1],['Job Search',12,1],['Meetings/Class',8,1],['Admin',5,0],['Exercise',10,0],['Social',5,0],['Meals',3,0],['Rest',3,0],['Leisure',2,0],['Commute',1,0],['Wasted',-5,0]];
const ls=(k,v)=>v===undefined?(()=>{try{return JSON.parse(localStorage.getItem('wtt:'+k))}catch(e){return null}})():localStorage.setItem('wtt:'+k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monday=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const tm=i=>{const m=495+15*i;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const todayIdx=()=>(new Date().getDay()+6)%7;
const curSlot=()=>{const n=new Date(),m=n.getHours()*60+n.getMinutes();return Math.min(63,Math.max(0,Math.ceil((m-495)/15)))};

let cats=ls('cats')||DEF.map(([n,xp,f])=>({n,xp,f})), week=monday(), day=todayIdx(), tab=matchMedia('(max-width:759px)').matches?'glass':'today';
let data={s:{},p:{}}, user=null, offline=!!ls('offline'), sel=null, selCat=null, timer;

// ---- theme ----
const ACC=[['Blue','#2383e2'],['Orange','#d9731f'],['Green','#1f9d6b'],['Purple','#8b5cf6'],['Pink','#e0457b'],['Red','#e5484d'],['Grey','#7c828d']];
let th=Object.assign({mode:'system',acc:0,tint:true,amo:false},ls('theme'));
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v*t+hx(b)[i]*(1-t)).toString(16).padStart(2,'0')).join('');
const mq=matchMedia('(prefers-color-scheme: dark)');
function pal(dark){const ac=ACC[th.acc][1];
 if(dark){
  if(th.amo)return{bg:'#000000',sf:'#0e0e10',sf2:'#1b1b1e',bd:'#27272c',tx:'#ffffff',mu:'#9a9aa3',ac};
  if(th.tint)return{bg:mix(ac,'#070b14',.12),sf:mix(ac,'#0a0f1a',.2),sf2:mix(ac,'#0a0f1a',.3),bd:mix(ac,'#0a0f1a',.36),tx:'#ffffff',mu:mix(ac,'#b8bcc6',.25),ac};
  return{bg:'#101114',sf:'#1b1c21',sf2:'#26272d',bd:'#2e2f36',tx:'#ffffff',mu:'#9b9ca6',ac}}
 if(th.tint)return{bg:mix(ac,'#fffcf8',.07),sf:mix(ac,'#ffffff',.03),sf2:mix(ac,'#ffffff',.14),bd:mix(ac,'#ffffff',.22),tx:'#1f1a17',mu:mix(ac,'#6d6d75',.25),ac};
 return{bg:'#f4f4f6',sf:'#ffffff',sf2:'#e9e9ed',bd:'#dedee3',tx:'#17171a',mu:'#74747c',ac}}
function applyTheme(){const dark=th.mode=='dark'||(th.mode=='system'&&mq.matches),p=pal(dark),r=document.documentElement.style;
 for(const k in p)r.setProperty('--'+k,p[k]);
 r.colorScheme=dark?'dark':'light';
 document.querySelectorAll('meta[name=theme-color]').forEach(m=>{const d=(m.getAttribute('media')||'').includes('dark');m.content=th.mode=='system'?pal(d).bg:p.bg})}
mq.addEventListener('change',applyTheme);
applyTheme();
function vTheme(){return `<div class="card"><h3>🎨 Appearance</h3><div class="seg">${['system','light','dark'].map(m=>`<button class="${th.mode==m?'on':''}" data-act="mode" data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div><div class="sws">${ACC.map((a,i)=>`<button class="sw ${th.acc==i?'on':''}" style="background:${a[1]}" data-act="acc" data-i="${i}" aria-label="${a[0]}"></button>`).join('')}</div><button class="tg ${th.tint&&!th.amo?'on':''}" data-act="tint" ${th.amo?'disabled':''}><span>Tinted background<small>The accent colors the background</small></span><i></i></button><button class="tg ${th.amo?'on':''}" data-act="amo"><span>AMOLED black<small>Pitch black background in dark mode</small></span><i></i></button></div>`}

// ---- stats ----
function dayStats(d){let n=0,xp=0,foc=0,waste=0,h=cats.map(()=>0);
 for(let i=0;i<64;i++){const s=data.s[d+'-'+i];if(!s||!cats[s[0]])continue;const c=cats[s[0]];n++;xp+=c.xp;h[s[0]]+=.25;if(c.f)foc+=.25;if(s[0]==cats.length-1)waste+=.25}
 return{n,xp,foc,waste,h}}
const verdict=x=>x>=450?'BEAST MODE':x>=300?'Strong day':x>=150?'Building momentum':'Getting started';
function weekStats(){const days=[0,1,2,3,4,5,6].map(dayStats);
 const t={xp:0,foc:0,waste:0,n:0,h:cats.map(()=>0)};
 days.forEach(s=>{t.xp+=s.xp;t.foc+=s.foc;t.waste+=s.waste;t.n+=s.n;s.h.forEach((v,i)=>t.h[i]+=v)});
 let run=0,best=0;days.forEach(s=>{run=s.n>=48?run+1:0;best=Math.max(best,run)});

function save(){ls('w2:'+week,data);if(!(sb&&user))return;
 const old=base[week]||{s:{},p:{}},q=ls('q')||{};
 new Set([...Object.keys(data.s),...Object.keys(old.s)]).forEach(k=>{const a=data.s[k],b=old.s[k];if(JSON.stringify(a)==JSON.stringify(b))return;
  const[d,i]=k.split('-').map(Number);q['s|'+week+'|'+k]=a?{k:'s',w:week,d,i,c:a[0],n:a[1]||''}:{k:'sd',w:week,d,i}});
 for(let d=0;d<7;d++)if((data.p[d]||'')!=(old.p[d]||''))q['p|'+week+'|'+d]={k:'p',w:week,d,t:data.p[d]||''};
 base[week]=clone(data);ls('q',q);setSync('wait');clearTimeout(timer);timer=setTimeout(flush,700)}
async function flush(){if(!sb||!user||flushing)return;const q=ls('q')||{},ks=Object.keys(q);
 if(!ks.length){setSync('ok');return}
 flushing=true;setSync('wait');const u=user.id,ops=ks.map(k=>q[k]);let fail=false;
 try{
  const up=ops.filter(o=>o.k=='s').map(o=>({user_id:u,week_start:o.w,day:o.d,slot:o.i,cat:o.c,note:o.n,updated_at:new Date().toISOString()}));
  if(up.length){const{error}=await sb.from('slots').upsert(up);if(error)throw error}
  const dl={};ops.filter(o=>o.k=='sd').forEach(o=>(dl[o.w+'|'+o.d]=dl[o.w+'|'+o.d]||[]).push(o.i));
  for(const g in dl){const[w,d]=g.split('|');const{error}=await sb.from('slots').delete().eq('user_id',u).eq('week_start',w).eq('day',+d).in('slot',dl[g]);if(error)throw error}
  const pl=ops.filter(o=>o.k=='p').map(o=>({user_id:u,week_start:o.w,day:o.d,text:o.t,updated_at:new Date().toISOString()}));
  if(pl.length){const{error}=await sb.from('plans').upsert(pl);if(error)throw error}
  const q2=ls('q')||{};ks.forEach(k=>{if(JSON.stringify(q2[k])==JSON.stringify(q[k]))delete q2[k]});ls('q',q2);
 }catch(e){fail=true;lastErr=(e&&e.message)||String(e)}
 flushing=false;
 if(fail){setSync('err');setTimeout(flush,15000)}else if(Object.keys(ls('q')||{}).length)flush();else setSync('ok')}
async function pull(){if(!sb||!user)return;const w=week;
 const[a,b]=await Promise.all([sb.from('slots').select('day,slot,cat,note').eq('week_start',w),sb.from('plans').select('day,text').eq('week_start',w)]);
 if(a.error||b.error){lastErr=(a.error||b.error).message;setSync('err');return}
 if(w!=week)return;
 const q=ls('q')||{},s={},p={};
 a.data.forEach(r=>s[r.day+'-'+r.slot]=[r.cat,r.note||'']);b.data.forEach(r=>p[r.day]=r.text||'');
 Object.values(q).forEach(o=>{if(o.w!=w)return;                       // unsent local changes always win
  if(o.k=='s')s[o.d+'-'+o.i]=[o.c,o.n];else if(o.k=='sd')delete s[o.d+'-'+o.i];else p[o.d]=o.t});
 data={s,p};base[w]=clone(data);ls('w2:'+w,data);loadCarry();renderSoft()}
function onRT(t,p){if(!user)return;const r=(p.new&&p.new.user_id)?p.new:p.old;
 if(!r||r.user_id!=user.id||r.week_start!=week)return;
 const q=ls('q')||{};
 if(t=='s'){const k=r.day+'-'+r.slot;if(q['s|'+week+'|'+k])return;
  if(p.eventType=='DELETE')delete data.s[k];else data.s[k]=[p.new.cat,p.new.note||''];}
 else{if(q['p|'+week+'|'+r.day])return;data.p[r.day]=p.eventType=='DELETE'?'':(p.new.text||'')}
 base[week]=clone(data);ls('w2:'+week,data);renderSoft()}
function sub(){if(!sb||!user||ch)return;const f='user_id=eq.'+user.id;
 ch=sb.channel('wtt-'+user.id)
  .on('postgres_changes',{event:'*',schema:'public',table:'slots',filter:f},p=>onRT('s',p))
  .on('postgres_changes',{event:'*',schema:'public',table:'plans',filter:f},p=>onRT('p',p))
  .on('postgres_changes',{event:'*',schema:'public',table:'settings',filter:f},p=>{if(p.new&&p.new.cats){cats=p.new.cats;ls('cats',cats);renderSoft()}})
  .subscribe(st=>{if(st=='SUBSCRIBED')flush().then(pull)})}

const TOPP='M32,24H128C128,70 94,92 84,116H76C66,92 32,70 32,24Z',BOTP='M32,216H128C128,170 94,148 84,124H76C66,148 32,170 32,216Z';
// area tables so that sand volume (not height) follows time
const HG=(()=>{const N=240,Y=[],W=[];
 for(let i=0;i<=N;i++){const t=i/N,u=1-t;Y.push(u*u*u*24+3*u*u*t*70+3*u*t*t*92+t*t*t*116);W.push(2*(u*u*u*128+3*u*u*t*128+3*u*t*t*94+t*t*t*84-80))}
 const an=[0],ab=[0];
 for(let i=N-1;i>=0;i--)an.push(an[an.length-1]+(W[i]+W[i+1])/2*(Y[i+1]-Y[i]));
 for(let i=1;i<=N;i++)ab.push(ab[i-1]+(W[i]+W[i-1])/2*(Y[i]-Y[i-1]));
 const T=an[N],inv=(a,h)=>f=>{const g=Math.min(1,Math.max(0,f))*T;let lo=0,hi=N;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<g)lo=m+1;else hi=m}const j=Math.max(1,lo),p=a[j-1],q=a[j],r=q>p?(g-p)/(q-p):0;return h(j-1)+(h(j)-h(j-1))*r};
 return{n:inv(an,j=>116-Y[N-j]),b:inv(ab,j=>Y[j]-24)}})();
// source bulb drains from the neck side, receiving bulb fills from its base; k parity decides which bulb is on top
function hgPaint(p,k){const fs=1-p,n=HG.n(fs),b=HG.b(p),on=fs>.004&&p<.996;
 return k%2===0?{A:[116-n,n],B:[216-b,b],S:[112,216-b,on]}:{A:[24,b],B:[124,n],S:[128,24+b,on]}}
function hgState(){const P=hg.every*60000,now=Date.now(),loc=now-new Date(now).getTimezoneOffset()*60000,k=Math.floor(loc/P),el=loc-k*P;return{k,p:el/P,rem:Math.ceil((P-el)/1000),end:now+(P-el)}}
function hgSpin(instant){document.querySelectorAll('.hgw').forEach(w=>{
  if(instant){w.style.transition='none';w.style.transform='rotate('+hgRot+'deg)';void w.offsetWidth;w.style.transition=''}
  else w.style.transform='rotate('+hgRot+'deg)'});
 if(!instant){document.querySelectorAll('.hg').forEach(e=>e.classList.add('fl'));clearTimeout(hgFl);hgFl=setTimeout(()=>document.querySelectorAll('.hg').forEach(e=>e.classList.remove('fl')),1700)}}

  hgK=s.k;if(one){hgRot+=180;hgSpin(false)}else{hgRot=(s.k%2)*180;hgSpin(true)}}

 return h}

function vSetup(){let h=head('Setup','Appearance, hourglass, categories, account')+vTheme()+vHgSet();
 h+=`<div class="card"><div class="set mut" style="margin:0"><span></span><span>Name</span><span>XP</span><span>Focus</span></div>${cats.map((c,i)=>`<div class="set"><input type="color" class="cp" value="${col(i)}" data-ci="${i}" data-f="c" aria-label="Color for ${esc(c.n)}"><input type="text" value="${esc(c.n)}" data-ci="${i}" data-f="n"><input type="number" value="${c.xp}" data-ci="${i}" data-f="xp"><input type="checkbox" ${c.f?'checked':''} data-ci="${i}" data-f="f"></div>`).join('')}<p class="mut" style="margin-bottom:0">Tap a circle to change its color. The last row is your time leak category.</p><button class="btn g" data-act="rc">Reset colors</button></div>`;
 h+=`<div class="card"><h3>Account</h3>`+(sb?(user?`<p class="mut">Signed in as ${esc(user.email)}. Data syncs across your devices.</p><button class="btn g" data-act="out">Sign out</button>`:`<p class="mut">Local mode. Sign in to sync.</p><button class="btn" data-act="signin">Sign in</button>`):`<p class="mut">Local mode. Add your Supabase keys in index.html to sync devices.</p>`)+`</div>`;
 return h}

function vAuth(){return `<h1 style="margin-top:40px">Time Log</h1><p class="mut">Sign in to sync your weeks across devices.</p><div class="card"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="err" id="msg"></div><button class="btn" data-act="in">Sign in</button><button class="btn g" data-act="up">Create account</button></div><button class="btn g" data-act="off">Use without account</button>`}

const desk=()=>matchMedia('(min-width:1180px)').matches;
const TABS=[['today','Today'],['week','Week'],['glass','Hourglass'],['setup','Setup']];
function buildNav(){$('#nav').innerHTML='<i class="ind"></i>'+TABS.map(([t,l])=>`<button data-act="tab" data-t="${t}" class="t-${t}">${ICON[t]}<span>${l}</span></button>`).join('')}
function syncNav(){const nav=$('#nav');if(!nav)return;
 nav.style.display=(sb&&!user&&!offline)?'none':'';
 const vis=TABS.map(x=>x[0]).filter(t=>!(t=='glass'&&desk()));
 nav.style.setProperty('--n',vis.length);nav.style.setProperty('--i',Math.max(0,vis.indexOf(tab)));
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
function render(){
 if(tab=='glass'&&desk())tab='today';
 syncNav();
 if(sb&&!user&&!offline){$('#app').innerHTML='<div class="narrow">'+vAuth()+'</div>';return}
 const y=scrollY;
 $('#app').innerHTML=(b=>tab=='today'?b:`<div class="narrow">${b}</div>`)(({today:vToday,week:vWeek,glass:vGlassPage,setup:vSetup})[tab]());
 document.querySelectorAll('textarea[data-plan]').forEach(autoh);
 hgTick();
 scrollTo(0,y)}

let tt;function toast(m,ms=2200){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),ms)}
const EM=['🧠','📚','💼','👥','🗂️','🏃','💬','🍽️','😴','🎮','🚌','🗑️'];
const hm=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dur=h=>{const m=Math.round(h*60),a=m/60|0,b=m%60;return (a?a+' h':'')+(a&&b?' ':'')+(b?b+' min':'')||'0 min'};
function info(){const s=dayStats(day);if(!s.n)return null;
 const pct=Math.round(s.n/64*100),bl=[];let run=0,rs=0,fb=0,fs=0;
 for(let i=0;i<64;i++){const v=data.s[day+'-'+i],c=v&&cats[v[0]];
  if(!c){run=0;continue}
  const p=bl[bl.length-1];if(p&&p.e==i-1&&p.c==v[0]&&p.t==v[1])p.e=i;else bl.push({s:i,e:i,c:v[0],t:v[1]});
  if(c.f){if(!run)rs=i;run++;if(run>fb){fb=run;fs=rs}}else run=0}
 const cl=cats.map((c,i)=>[i,s.h[i]]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),top=cl[0][0];
 const a=[`${EM[top]||'🔹'} Most time went to ${cats[top].n} (${dur(s.h[top])}).`,
  fb?`🎯 Longest focus block: ${dur(fb/4)} (${hm(480+15*fs)}–${hm(495+15*(fs+fb-1))}).`:'🎯 No focus block today.',
  s.waste?`⚠️ Time leak: ${dur(s.waste)} (${Math.round(s.waste*4/s.n*100)}% of logged time).`:'✅ No wasted time.'];
 if(pct<75)a.push(`📝 Only ${pct}% logged, so this picture is incomplete.`);
 a.push(s.waste>=1?'💡 Tomorrow: cut the time leak first.':s.foc<3?'💡 Tomorrow: add one more focus block.':'💡 Tomorrow: keep this rhythm.');
 return{s,pct,bl,cl,a}}
function pie(h){const T=h.reduce((x,y)=>x+y,0);if(!T)return '<p class="mut">No data yet.</p>';
 const R=92,r=54,C=100,n=h.filter(v=>v).length,P=(q,t)=>(C+q*Math.cos(t)).toFixed(2)+' '+(C+q*Math.sin(t)).toFixed(2);
 let a=-Math.PI/2,o='';
 h.forEach((v,i)=>{if(!v)return;const sp=v/T*2*Math.PI,a0=a;a+=sp;
  if(n==1){o+=`<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${col(i)}" stroke-width="${R-r}"/>`;return}
  const p=Math.max(.5,Math.min(5,sp*28)),g=5,Ro=R-p,Ri=r+p,d1=(p+g/2)/Ro,d2=(p+g/2)/Ri;
  if(a0+d1>=a-d1)return;
  const big=(a-d1)-(a0+d1)>Math.PI?1:0;
  o+=`<path d="M${P(Ro,a0+d1)}A${Ro} ${Ro} 0 ${big} 1 ${P(Ro,a-d1)}L${P(Ri,a-d2)}A${Ri} ${Ri} 0 ${big} 0 ${P(Ri,a0+d2)}Z" fill="${col(i)}" stroke="${col(i)}" stroke-width="${2*p}" stroke-linejoin="round"/>`});
 return `<svg viewBox="0 0 200 200" style="width:100%;max-width:260px;display:block;margin:0 auto">${o}<text x="100" y="98" text-anchor="middle" font-size="26" font-weight="700" fill="var(--tx)">${T.toFixed(1)}h</text><text x="100" y="118" text-anchor="middle" font-size="11" fill="var(--mu)">logged</text></svg>`}
function charts(){const I=info();if(!I)return '<div class="card"><p class="mut" style="margin:0">Nothing logged yet.</p></div>';
 const{s,cl,a}=I,mx=Math.max(...s.h);
 return `<div class="card"><h3>🥧 Where the time went</h3>${pie(s.h)}<div style="margin-top:10px">${cl.map(([i,h])=>`<div class="row" style="padding:4px 0"><span class="dot" style="background:${col(i)}"></span><span class="grow" style="font-size:14px">${esc(cats[i].n)}</span><span style="font-size:14px">${dur(h)} · ${Math.round(h*4/s.n*100)}%</span></div>`).join('')}</div></div>
<div class="card"><h3>📊 Hours per category</h3>${cl.map(([i,h])=>`<div class="row"><span style="width:104px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(cats[i].n)}</span><div class="grow bar"><span style="width:${h/mx*100}%;background:${col(i)}"></span></div><span style="width:38px;text-align:right;font-size:13px">${h.toFixed(1)}</span></div>`).join('')}</div>
<div class="card"><h3>🔎 Analysis</h3>${a.map(x=>`<p style="margin:6px 0;font-size:14px">${x}</p>`).join('')}<p class="mut" style="margin:10px 0 0">${s.xp} XP: ${verdict(s.xp)}</p></div>`}
function summary(){const I=info();if(!I)return '';const{s,pct,bl,cl,a}=I;
 const dt=new Date(addDays(week,day)+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
 let o=`📅 ${dt}\n\n📊 Overview\n⚡ ${s.xp} XP (${verdict(s.xp)})\n🎯 Focus: ${dur(s.foc)}\n🗑️ Wasted: ${dur(s.waste)}\n📝 Logged: ${s.n}/64 slots (${pct}%)\n\n`;
 const pl=(data.p[day]||'').trim();if(pl)o+=`📋 Plan\n${pl}\n\n`;
 o+=`⏱️ Time by category\n${cl.map(([i,h])=>`${EM[i]||'🔹'} ${cats[i].n}: ${dur(h)} (${Math.round(h*4/s.n*100)}%)`).join('\n')}\n\n`;
 o+=`🗒️ Timeline\n${bl.map(b=>`${hm(480+15*b.s)}–${hm(495+15*b.e)} ${EM[b.c]||'🔹'} ${cats[b.c].n}${b.t?': '+b.t:''}`).join('\n')}\n\n`;
 return o+`🔎 Quick analysis\n${a.join('\n')}`}
function exportDay(){const t=summary();if(!t)return toast('Nothing logged for this day yet');
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Summary copied'),()=>{
  $('#sheet').innerHTML=`<div><h3 style="margin:0">Day summary</h3><textarea id="xt" style="min-height:260px">${esc(t)}</textarea><button class="btn" data-act="close">Done</button></div>`;$('#sheet').classList.add('open');$('#xt').select()})}

let fs=null;
const prevOf=i=>i>0?data.s[day+'-'+(i-1)]:(day>0?data.s[(day-1)+'-63']:null);
const markCat=()=>document.querySelectorAll('.cg button').forEach((x,k)=>x.classList.toggle('on',k===selCat));
const scrollFs=()=>{const e=document.querySelector('.slot.fs');if(e)e.scrollIntoView({block:'nearest'})};
function moveFs(d){if(fs===null)fs=week==monday()&&day==todayIdx()?curSlot():0;else fs=Math.max(0,Math.min(63,fs+d));
 document.querySelectorAll('.slot.fs').forEach(x=>x.classList.remove('fs'));
 const e=document.querySelector('.slot[data-i="'+fs+'"]');if(e){e.classList.add('fs');e.scrollIntoView({block:'nearest'})}}
function sameAs(i,n){const p=prevOf(i);if(!p||!cats[p[0]])return toast('Nothing before this slot');
 for(let k=0;k<=n&&i+k<64;k++)data.s[day+'-'+(i+k)]=[p[0],p[1]||''];save();fs=Math.min(63,i+n+1);render();scrollFs()}
function doSave(){if(selCat===null)return toast('Pick a category first');const t=$('#act').value.trim(),n=+$('#fill').value;
 for(let k=0;k<=n&&sel+k<64;k++)data.s[day+'-'+(sel+k)]=[selCat,t];save();closeSheet();fs=Math.min(63,sel+n+1);render();scrollFs()}
function filt(q){q=q.trim().toLowerCase();const L=cats.map((c,i)=>[i,c.n.toLowerCase()]);
 const m=q?L.filter(x=>x[1].includes(q)).sort((a,b)=>(b[1].startsWith(q)-a[1].startsWith(q))||a[0]-b[0]).map(x=>x[0]):L.map(x=>x[0]);
 document.querySelectorAll('.cg button').forEach((b,k)=>b.style.display=m.includes(k)?'':'none');
 if(q&&m.length)selCat=m[0];markCat()}
function stepCat(d){const v=[...document.querySelectorAll('.cg button')].map((b,k)=>b.style.display=='none'?-1:k).filter(k=>k>=0);if(!v.length)return;
 const p=v.indexOf(selCat);selCat=v[(p+d+v.length)%v.length];markCat()}
function openSheet(i){sel=i;fs=i;const v=data.s[day+'-'+i],pv=prevOf(i),can=pv&&cats[pv[0]];selCat=v&&cats[v[0]]?v[0]:null;
 $('#sheet').innerHTML=`<div><h3 style="margin:0">${DN[day]}, ${tm(i)}</h3><p class="mut" style="margin:2px 0">What did you do in the 15 minutes before?</p><input id="tq" class="ta" type="text" placeholder="Type a category name…" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="cg">${cats.map((c,k)=>`<button tabindex="-1" data-act="cat" data-i="${k}" class="${k===selCat?'on':''}"><span class="dot" style="background:${col(k)}"></span>${esc(c.n)}</button>`).join('')}</div><input id="act" type="text" placeholder="Note (optional)" value="${esc(v?v[1]||'':'')}"><select id="fill">${[0,1,2,3,4,5,6,7].map(n=>`<option value="${n}">${n?'Also fill the next '+n+' slot'+(n>1?'s':''):'This slot only'}</option>`).join('')}</select><button class="btn" data-act="ok">Save</button><button class="btn g" data-act="same" ${can?'':'disabled'}>Same as before${can?' ('+esc(cats[pv[0]].n)+')':''}</button><button class="btn g" data-act="clr">Clear</button><p class="mut kb">Enter saves · Esc closes · Tab next field · ↑↓ pick category</p></div>`;
 $('#sheet').classList.add('open');
 if(matchMedia('(hover:hover) and (pointer:fine)').matches)$('#tq').focus()}
const closeSheet=()=>$('#sheet').classList.remove('open');

async function auth(k){const email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||password.length<6){$('#msg').textContent='Enter your email and a password (at least 6 characters).';return}
 const r=k=='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 $('#msg').textContent=r.error?r.error.message:(k=='up'&&!r.data.session?'Check your email to confirm, then sign in.':'')}

document.addEventListener('click',async e=>{
 if(e.target.id=='sheet')return closeSheet();
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 if(a=='slot'&&!matchMedia('(max-width:759px)').matches&&!e.target.closest('.cb'))return; // desktop: only the category button opens the sheet
 if(a=='tab'){tab=b.dataset.t;render();scrollTo(0,0);if(tab=='week')loadCarry()}
 else if(a=='prev')go(-1);else if(a=='next')go(1);
 else if(a=='day'){day=i;render()}
 else if(a=='slot')openSheet(i);
 else if(a=='cat'){selCat=i;document.querySelectorAll('.cg button').forEach((x,k)=>x.classList.toggle('on',k==i))}
 else if(a=='ok')doSave();
 else if(a=='same'){sameAs(sel,+$('#fill').value);closeSheet()}
 else if(a=='clr'){const n=+$('#fill').value;for(let k=0;k<=n&&sel+k<64;k++)delete data.s[day+'-'+(sel+k)];save();closeSheet();render()}
 else if(a=='in'||a=='up')auth(a);
 else if(a=='off'){offline=true;ls('offline',1);boot()}
 else if(a=='signin'){offline=false;localStorage.removeItem('wtt:offline');render()}
 else if(a=='out'){await sb.auth.signOut()}
 else if(a=='mode'||a=='acc'||a=='tint'||a=='amo'){if(a=='mode')th.mode=b.dataset.m;else if(a=='acc')th.acc=i;else if(a=='tint')th.tint=!th.tint;else th.amo=!th.amo;ls('theme',th);applyTheme();render()}
 else if(a=='rc'){cats.forEach(c=>delete c.c);saveCatsSoon();render()}
 else if(a=='tslot'){nowSync();openSheet(i)}
 else if(a=='hgp'){hg.every=+b.dataset.m;ls('hg',hg);hgTick(true);render()}
 else if(a=='exp')exportDay();
 else if(a=='sd'){const w=user?' ('+user.email+')':'',hint=/does not exist|schema cache/i.test(lastErr)?' → run schema.sql in Supabase':'';
  toast({loc:'Local only: not signed in. Data stays on this device.',ok:'Synced'+w,wait:'Sending changes…'+w,err:'Sync error: '+lastErr+hint+w}[syncSt]||syncSt,8000)}
 else if(a=='pt'){planShut=!planShut;render()}
 else if(a=='an'){$('#sheet').innerHTML=`<div><div class="row"><h3 class="grow" style="margin:0">📈 Day analysis</h3><button class="pill" data-act="close">Close</button></div>${charts()}</div>`;$('#sheet').classList.add('open')}
 else if(a=='close')closeSheet();
 else if(a=='paste'){try{const t=await navigator.clipboard.readText();if(t){const ta=$('[data-plan]');ta.value=ta.value?ta.value+'\n'+t:t;data.p[day]=ta.value;autoh(ta);save()}}catch(x){toast('Paste blocked. Long-press the box and paste.')}}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id=='tq'){filt(t.value);return}
 if(t.dataset.plan!==undefined){data.p[day]=t.value;autoh(t);save()}
 else if(t.dataset.n!==undefined){const k=day+'-'+t.dataset.n,v=data.s[k];if(v)v[1]=t.value;else if(t.value)data.s[k]=[null,t.value];if(v&&v[0]===null&&!t.value)delete data.s[k];save()}
 else if(t.dataset.ci!==undefined){const c=cats[+t.dataset.ci],f=t.dataset.f;c[f]=f=='n'?t.value:f=='c'?t.value:f=='xp'?+t.value||0:t.checked?1:0;saveCatsSoon()}});

document.addEventListener('keydown',e=>{
 const t=e.target,tag=t.tagName;
 if($('#sheet').classList.contains('open')){
  if(e.key=='Escape'){e.preventDefault();closeSheet();return}
  if(e.key=='Enter'&&(tag=='INPUT'||tag=='SELECT')){e.preventDefault();doSave();return}
  if(t.id=='tq'&&(e.key=='ArrowDown'||e.key=='ArrowUp')){e.preventDefault();stepCat(e.key=='ArrowDown'?1:-1)}
  return}
 if(tab!='today'||!document.querySelector('.slot')||e.metaKey||e.ctrlKey||e.altKey)return;
 if(tag=='INPUT'||tag=='TEXTAREA'||tag=='SELECT'){if(e.key=='Escape'||(e.key=='Enter'&&t.classList.contains('nt')))t.blur();return}
 const mob=matchMedia('(max-width:759px)').matches,mv={ArrowDown:mob?4:1,ArrowUp:mob?-4:-1,ArrowRight:mob?1:0,ArrowLeft:mob?-1:0}[e.key];
 if(mv){e.preventDefault();moveFs(mv)}
 else if(e.key=='Enter'&&fs!==null&&tag!='BUTTON'){e.preventDefault();openSheet(fs)}
 else if((e.key=='s'||e.key=='S')&&fs!==null){e.preventDefault();sameAs(fs,0)}
 else if((e.key=='Delete'||e.key=='Backspace')&&fs!==null){e.preventDefault();delete data.s[day+'-'+fs];save();render();scrollFs()}
});
(async()=>{
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
 if(sb){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;
  sb.auth.onAuthStateChange((ev,s)=>{const id=s?.user?.id;if(id!==user?.id){user=s?.user||null;if(user)boot();else{if(ch){sb.removeChannel(ch);ch=null}render()}}})}
 buildNav();syncNav();hgReady=true;
 setInterval(()=>hgTick(),1000);
 matchMedia('(min-width:1180px)').addEventListener('change',()=>render());
 {let ly=scrollY;addEventListener('scroll',()=>{const y=scrollY,d=y-ly;if(Math.abs(d)<6)return;ly=y;$('#nav').classList.toggle('mini',y>80&&d>0)},{passive:true})}
 let cm=monday();
 const wake=()=>{if(document.hidden)return;
  if(monday()!=cm){const old=cm;cm=monday();if(week==old){week=cm;day=todayIdx();loadWeek();return}}
  hgTick();flush().then(pull)};
 document.addEventListener('visibilitychange',wake);addEventListener('online',wake);addEventListener('focus',wake);
 if(sb&&!user&&!offline)render();else boot();
})();
</script>
